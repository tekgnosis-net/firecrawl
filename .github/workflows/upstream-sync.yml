name: Upstream Sync

# Periodically merge upstream firecrawl/firecrawl into this fork and open a PR.
#
# This fork carries local enhancements (camoufox stealth engine, GHCR/Redis
# infra, OpenAI support, autumn hardening). The sync script auto-resolves only
# the deterministic "workflows we deleted" conflict class and gates on a clean
# `tsc` build before pushing a branch. A human reviews and merges the PR — the
# workflow never writes to main directly.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run merge + build gate but skip push/PR (for testing the workflow)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history for merge)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          # This monorepo has no root package.json, so action-setup can't find
          # the packageManager field (it lives in apps/api/package.json). Pin it
          # explicitly — keep in sync with apps/api/package.json "packageManager".
          version: 10.16.1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - name: Set up Rust (native crate build gate)
        uses: dtolnay/rust-toolchain@stable

      - name: Provision FoundationDB client (build gate needs libfdb_c)
        # Upstream's nuq-fdb worker pulls the `foundationdb` npm package, whose
        # postinstall gyp build hard-fails without libfdb_c — so once that dep is
        # merged, `pnpm install` in the build gate (and thus every weekly sync)
        # would false-fail on a clean ubuntu runner. Provision the same client
        # deb apps/api/Dockerfile installs. Keep FDB_VERSION in sync with the
        # Dockerfile's ARG FDB_VERSION.
        run: |
          set -euo pipefail
          FDB_VERSION=7.3.63
          ARCH="$(dpkg --print-architecture)"
          curl -fsSL -o /tmp/fdb-clients.deb \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_${ARCH}.deb"
          sudo dpkg -i /tmp/fdb-clients.deb
          rm -f /tmp/fdb-clients.deb

      - name: Run upstream sync
        id: sync
        continue-on-error: true
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash .github/scripts/sync-upstream.sh

      - name: Open PR or escalate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin gh to this fork: a bare `gh` resolves the base repo from git
          # remotes, and the sync script adds an `upstream` remote that would
          # otherwise misdirect PR/issue creation to firecrawl/firecrawl.
          GH_REPO: ${{ github.repository }}
          # Bind step outputs to env vars (data, not inlined into shell syntax).
          RESULT: ${{ steps.sync.outputs.result }}
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            ready)
              if ! gh pr list --head "$BRANCH" --json number --jq '.[0].number' | grep -q .; then
                gh pr create --base main --head "$BRANCH" \
                  --title "chore(sync): merge upstream firecrawl ($(date +%Y-%m-%d))" \
                  --body $'Automated upstream merge.\n\n- `tsc` build gate passed\n- only deterministic (deleted-workflow) conflicts auto-resolved\n- fork enhancements expected intact\n\nReview the diff before merging.'
              fi
              ;;
            uptodate)
              echo "Already up to date with upstream — nothing to do."
              ;;
            dryrun)
              echo "Dry run complete — merge + build gate exercised, no PR opened."
              ;;
            *)
              # Escalate. Reuse ONE canonical tracking issue (comment on it)
              # instead of opening a fresh date-stamped issue every week, then
              # FAIL the run — otherwise a successful `gh issue create` lets the
              # job exit green and the escalation hides behind a passing check.
              TITLE="Upstream sync needs manual resolution"
              BODY="$(printf 'sync-upstream.sh stopped with result=%s (non-deterministic conflict or build failure) on %s.\n\nResolve locally:\n\n    bash .github/scripts/sync-upstream.sh\n\nRun logs (conflicting paths): %s/%s/actions/runs/%s' \
                "${RESULT:-<none>}" "$(date +%Y-%m-%d)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
              EXISTING="$(gh issue list --state open --limit 100 --json number,title \
                --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
              if [ -n "$EXISTING" ]; then
                gh issue comment "$EXISTING" --body "$BODY"
                echo "Updated existing escalation issue #$EXISTING"
              else
                gh issue create --title "$TITLE" --body "$BODY"
              fi
              echo "::error::Upstream sync is stuck (result=${RESULT:-<none>}) — see the escalation issue."
              exit 1
              ;;
          esac
