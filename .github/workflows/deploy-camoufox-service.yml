name: Deploy Camoufox Service to GHCR

# Smoke-gated build & publish for the Camoufox stealth image.
#
# - PR touching the service  -> build + smoke ONLY (no publish). A broken
#   camoufox-js bump fails the PR check and can never reach :latest.
# - push to main             -> build + smoke, then publish the *smoked* image
#   to :latest and :sha-<commit>.
#
# The smoke step boots the image and asserts the browser launches and a real
# page renders (.github/scripts/camoufox-smoke.sh). We build once with
# load:true and push that exact image, so what ships == what was tested.

on:
  push:
    branches:
      - main
    paths:
      - apps/camoufox-service-ts/**
      - .github/workflows/deploy-camoufox-service.yml
      - .github/scripts/camoufox-smoke.sh
  pull_request:
    paths:
      - apps/camoufox-service-ts/**
      - .github/workflows/deploy-camoufox-service.yml
      - .github/scripts/camoufox-smoke.sh
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Whether this run is allowed to publish (main pushes only).
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (load locally, no push)
        uses: docker/build-push-action@v7
        with:
          context: ./apps/camoufox-service-ts
          load: true
          push: false
          tags: camoufox-service:candidate
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (boot + real scrape + SSRF guard)
        env:
          IMAGE: camoufox-service:candidate
        run: bash .github/scripts/camoufox-smoke.sh

      # --- publish only on main, only after smoke passed ---
      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Owner
        if: env.PUBLISH == 'true'
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_ENV}"

      - name: Tag & push the smoked image (:latest + :sha-<commit>)
        if: env.PUBLISH == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SHA:0:12}"
          repo="ghcr.io/${REPO_OWNER}/camoufox-service"
          docker tag camoufox-service:candidate "${repo}:latest"
          docker tag camoufox-service:candidate "${repo}:sha-${short}"
          docker push "${repo}:latest"
          docker push "${repo}:sha-${short}"
          echo "Published ${repo}:latest and ${repo}:sha-${short}"
