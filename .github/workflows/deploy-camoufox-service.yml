name: Deploy Camoufox Service to GHCR

on:
  push:
    branches:
      - main
    paths:
      - apps/camoufox-service-ts/**
      - .github/workflows/deploy-camoufox-service.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Owner
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_ENV}"

      - name: 'Build and Push Image (amd64)'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/camoufox-service-ts
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/camoufox-service:latest
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
