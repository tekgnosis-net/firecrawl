name: Deploy Images to GHCR

on:
  push:
    branches:
      - main
    # Only trigger on inputs that affect the runtime image (dist/, native/,
    # node_modules, Go .so). Doc/spec/test-config changes are skipped.
    paths:
      - apps/api/src/**
      - apps/api/native/**
      - apps/api/sharedLibs/**
      - apps/api/package.json
      - apps/api/pnpm-lock.yaml
      - apps/api/pnpm-workspace.yaml
      - apps/api/tsconfig.json
      - apps/api/Dockerfile
      - .github/workflows/deploy-image.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Owner
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_ENV}"

      - name: 'Build and Push Image (amd64)'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/firecrawl:latest
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
