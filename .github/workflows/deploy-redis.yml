name: Deploy Redis to GHCR

on:
  push:
    branches:
      - main
    paths:
      - apps/redis/**
      - .github/workflows/deploy-redis.yml
  workflow_dispatch:

jobs:
  push-app-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: './apps/redis'
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v5

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Owner
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_ENV}"

      - name: 'Build and Push Redis Image'
        run: |
          docker build . --tag "ghcr.io/${REPO_OWNER}/firecrawl-redis:latest"
          docker push "ghcr.io/${REPO_OWNER}/firecrawl-redis:latest"
