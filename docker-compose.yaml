name: firecrawl

x-common-service: &common-service
  # Default: pull the image from this fork's GHCR. Falls back to local build
  # if the image is not available (first run, before CI has pushed). Force a
  # local build with: docker compose build api worker ...
  image: ${FIRECRAWL_IMAGE:-ghcr.io/tekgnosis-net/firecrawl:latest}
  build: apps/api

  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  networks:
    - backend
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-common-env: &common-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_URL:-redis://redis:6379}
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}
  # Stealth fallback engine. Points at the in-compose camoufox-service by default.
  # Firecrawl registers a "camoufox" engine (quality: -3, stealthProxy: true)
  # that is selected when a scrape requests proxy: "stealth" or when playwright
  # returns 401/403/429 with proxy: "auto" (auto-escalation via AddFeatureError).
  # To disable: set CAMOUFOX_MICROSERVICE_URL= (empty) in your .env.
  CAMOUFOX_MICROSERVICE_URL: ${CAMOUFOX_MICROSERVICE_URL:-http://camoufox-service:3001/scrape}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: ${POSTGRES_HOST:-nuq-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-8}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  MODEL_NAME: ${MODEL_NAME}
  MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME} 
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL} 
  AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY}
  TEST_API_KEY: ${TEST_API_KEY}
  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN}
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN}
  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}
  LOGGING_LEVEL: ${LOGGING_LEVEL}
  PROXY_SERVER: ${PROXY_SERVER}
  PROXY_USERNAME: ${PROXY_USERNAME}
  PROXY_PASSWORD: ${PROXY_PASSWORD}
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}

services:
  playwright-service:
    image: ${PLAYWRIGHT_SERVICE_IMAGE:-ghcr.io/tekgnosis-net/playwright-service:latest}
    build: apps/playwright-service-ts
    environment:
      PORT: 3000
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS}
      BLOCK_MEDIA: ${BLOCK_MEDIA}
      # Configure maximum concurrent pages for Playwright browser instances
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
    networks:
      - backend
    # Resource limits for Docker Compose (not Swarm)
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  # ----- Optional: Camoufox stealth fallback -----
  # The camoufox-service container runs Camoufox (a Firefox fork patched at the
  # C++ level for anti-bot fingerprint resistance) in-process via Playwright.
  # The Camoufox binary is bundled into the image at build time.
  #
  # To enable: set CAMOUFOX_MICROSERVICE_URL=http://camoufox-service:3001/scrape
  # in the api service's environment (already wired via common-env).
  # To disable: leave CAMOUFOX_MICROSERVICE_URL unset and skip this service:
  #   docker compose up --scale camoufox-service=0
  # or just bring up the services you want explicitly.
  camoufox-service:
    image: ${CAMOUFOX_SERVICE_IMAGE:-ghcr.io/tekgnosis-net/camoufox-service:latest}
    build: apps/camoufox-service-ts
    environment:
      PORT: 3001
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS}
      BLOCK_MEDIA: ${BLOCK_MEDIA}
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-5}
    networks:
      - backend
    cpus: 2.0
    mem_limit: 3G
    memswap_limit: 3G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  api:
    <<: *common-service
    environment:
      <<: *common-env
      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}
      EXTRACT_WORKER_PORT: ${EXTRACT_WORKER_PORT:-3004}
      WORKER_PORT: ${WORKER_PORT:-3005}
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-60000}
      ENV: local
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "${PORT:-3002}:${INTERNAL_PORT:-3002}"
    command: node dist/src/harness.js --start-docker
    # Resource limits for Docker Compose (not Swarm)
    # Increase if you have more CPU cores/RAM available
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G

  redis:
    # Use this fork's purpose-built Redis image. It ships start-redis-server.sh
    # which raises the in-container ulimit AND launches redis-server with an
    # explicit --maxclients flag (default 50000). The upstream redis:alpine
    # image leaves maxclients at the 10000 default, which Firecrawl's
    # multi-process worker harness can exhaust in normal operation.
    #
    # To use Valkey or upstream Redis instead, override the REDIS_IMAGE env
    # var (e.g. REDIS_IMAGE=valkey/valkey:alpine) — but you will lose the
    # bundled start-up tuning.
    image: ${REDIS_IMAGE:-ghcr.io/tekgnosis-net/firecrawl-redis:latest}
    build: apps/redis
    environment:
      # Override the default 50000 if you need more headroom; the container
      # ulimit (below) caps the practical maximum near 65000.
      MAXCLIENTS: ${REDIS_MAXCLIENTS:-50000}
    # Raise the file-descriptor limit so redis can actually allocate the
    # MAXCLIENTS sockets it was told to. The x-common-service anchor's
    # ulimits don't reach this service because it doesn't merge in
    # <<: *common-service.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - backend
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
  
  nuq-postgres:
    image: ${NUQ_POSTGRES_IMAGE:-ghcr.io/tekgnosis-net/nuq-postgres:latest}
    build: apps/nuq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

networks:
  backend:
    driver: bridge
